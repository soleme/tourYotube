/* 레이아웃: 16:9 도트 게임 화면 하나 + 아래 터치 패드. 밤의 아케이드 한 가지 테마로 고정. */
:root {
  color-scheme: dark;
  --bg: #120f24;
  --bg2: #1a1533;
  --panel: #1d1840;
  --panel2: #2c2560;
  --ink: #fff8ec;
  --dim: #b4acd8;
  --red: #ff4d5e;
  --gold: #ffd23f;
  --good: #6be38f;
  --bad: #ff7a7a;
  --black: #07060f;
  --f-ui: 'Galmuri11', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  background-image: radial-gradient(var(--bg2) 1px, transparent 1px);
  background-size: 6px 6px;
  color: var(--ink);
  font-family: var(--f-ui);
  font-size: 12px;
  -webkit-font-smoothing: none;
  -webkit-tap-highlight-color: transparent;
}
#app {
  min-height: 100%;
  box-sizing: border-box;
  display: flex;
  justify-content: center;
  align-items: center;
  padding-inline: 16px;
  padding-block: 12px;
}
#frame {
  width: 100%;
  max-width: min(1280px, calc((100dvh - 64px) * 16 / 9));
  display: flex;
  flex-direction: column;
  gap: 10px;
}
#screen {
  position: relative;
  width: 100%;
  max-width: 100%;
  aspect-ratio: 16 / 9;
  background: var(--black);
  border: 3px solid var(--ink);
  box-shadow: 0 0 0 3px var(--black), 6px 6px 0 3px var(--black);
  box-sizing: border-box;
  overflow: hidden;
}
#cv {
  display: block;
  width: 100%;
  height: 100%;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  touch-action: none;
  cursor: pointer;
}
#ui {
  position: absolute;
  inset: 0;
  pointer-events: none;
  font-family: var(--f-ui);
  font-size: var(--fs, 12px);
  line-height: 1.5;
  color: var(--ink);
}
#ui > * { pointer-events: auto; }
#toasts {
  position: absolute;
  top: 12%;
  left: 0;
  right: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  pointer-events: none;
  font-size: var(--fs, 12px);
  z-index: 5;
}
.toast {
  background: var(--black);
  color: var(--ink);
  border: 2px solid var(--ink);
  padding: 0.2em 0.8em;
  transition: opacity 0.4s, transform 0.4s;
}
.toast.gold { color: var(--black); background: var(--gold); border-color: var(--black); }
.toast.out { opacity: 0; transform: translateY(-6px); }

/* ---------- 대화창 ---------- */
.dlg, .panel-in {
  background: var(--panel);
  border: 2px solid var(--ink);
  box-shadow: 0 0 0 2px var(--black), inset 0 0 0 2px var(--panel2), 4px 4px 0 2px rgba(0, 0, 0, 0.5);
}
.dlg {
  position: absolute;
  left: 3%;
  right: 3%;
  bottom: 4%;
  max-height: 72%;
  overflow-y: auto;
  box-sizing: border-box;
  padding: 0.6em 0.9em 0.7em;
}
.dlg.menu { left: 50%; right: auto; transform: translateX(-50%); width: min(70%, 26em); bottom: 6%; }
.dlg-title { color: var(--gold); margin-bottom: 0.2em; display: flex; align-items: center; gap: 0.4em; }
.dlg-text { margin-bottom: 0.4em; overflow-wrap: anywhere; }
.dlg-text:empty { display: none; }
.caret { color: var(--red); animation: blink 0.5s steps(2) infinite; }
.dlg-choices { display: flex; flex-direction: column; gap: 2px; }
.inp {
  display: block;
  width: 100%;
  box-sizing: border-box;
  font: inherit;
  color: var(--ink);
  background: var(--black);
  border: 2px solid var(--dim);
  padding: 0.3em 0.5em;
  margin-bottom: 0.5em;
  outline: none;
}
.inp:focus { border-color: var(--gold); }

.btn {
  all: unset;
  box-sizing: border-box;
  position: relative;
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  column-gap: 0.7em;
  padding: 0.15em 0.5em 0.15em 1.5em;
  cursor: pointer;
  color: var(--ink);
  font: inherit;
  min-height: 1.6em;
}
.btn .cur { position: absolute; left: 0.4em; color: var(--red); visibility: hidden; }
.btn .sub { color: var(--dim); }
.btn .hint { color: var(--dim); }
.btn .cnt { color: var(--gold); }
.btn:hover, .btn.focus { background: var(--panel2); }
.btn.focus .cur { visibility: visible; animation: blink 0.6s steps(2) infinite; }
.btn:focus-visible { outline: 2px solid var(--gold); outline-offset: -2px; }
.btn.off { opacity: 0.45; cursor: not-allowed; }
.btn.ghost .lbl { color: var(--dim); }
.btn.owned .lbl { color: var(--good); }
@keyframes blink { 50% { opacity: 0; } }

const Snd = {

    if (Music.pending) { const p = Music.pending; Music.pending = null; Music.play(p); }
  },

    g.gain.setValueAtTime(0.0001, t);

    g.gain.exponentialRampToValueAtTime(0.0001, t + d);

  },

const SCALES = {
  majPenta: [0, 2, 4, 7, 9], minPenta: [0, 3, 5, 7, 10], major: [0, 2, 4, 5, 7, 9, 11],
  dorian: [0, 2, 3, 5, 7, 9, 10], japanese: [0, 1, 5, 7, 8], hijaz: [0, 1, 4, 5, 7, 8, 10],
  bhairav: [0, 1, 4, 5, 7, 8, 11], blues: [0, 3, 5, 6, 7, 10], lydian: [0, 2, 4, 6, 7, 9, 11],
  mixo: [0, 2, 4, 5, 7, 9, 10],
};
const trackCache = {};
function genTrack(id, o) {
  if (trackCache[id]) return trackCache[id];
  const r = seeded(id + '♪');
  const sc = SCALES[o.scale] || SCALES.majPenta, n = sc.length;
  const deg = d => sc[((d % n) + n) % n] + 12 * Math.floor(d / n);
  const len = 64;
  const mel = Array(len).fill(null), mlen = Array(len).fill(1), bass = Array(len).fill(null), drum = Array(len).fill(0);
  const prog = o.prog || [0, Math.floor(n * 0.6), Math.floor(n * 0.8), 0];
  const motif = [];
  let p = n + Math.floor(r() * 3);
  for (let i = 0; i < 32; i++) {
    const strong = i % 4 === 0, eighth = i % 2 === 0;
    const pr = strong ? 0.85 : eighth ? (o.busy || 0.45) : (o.busy || 0.45) * 0.3;
    if (r() < pr) { p = clamp(p + Math.round((r() - 0.5) * 4), n - 2, n * 2 + 2); motif.push(p); }
    else motif.push(null);
  }
  for (let i = 0; i < len; i++) {
    const bar = Math.floor(i / 16);
    let m = motif[i % 32];
    if (bar === 3 && i % 16 >= 8) m = (i % 4 === 0) ? n + (i % 16 === 12 ? 0 : 2) : null; // 마무리
    if (bar === 2 && m != null && r() < 0.3) m += 1;
    mel[i] = m == null ? null : o.root + deg(m) + (o.mel8 || 0);
    const chordDeg = prog[bar];
    if (i % 8 === 0 || (o.syncBass && i % 16 === 6)) bass[i] = o.root - 12 + deg(chordDeg);
    else if (i % 8 === 4 && o.walkBass) bass[i] = o.root - 12 + deg(chordDeg + 2);
    drum[i] = (i % 8 === 0) ? 1 : (i % 8 === 4) ? 2 : (i % 2 === 0 ? 3 : 0);
    if (o.latin && (i % 16 === 3 || i % 16 === 11)) drum[i] = 1;
  }
  for (let i = 0; i < len; i++) if (mel[i] != null) { let l = 1; while (i + l < len && mel[i + l] == null && l < 4) l++; mlen[i] = l; }
  const t = { id, bpm: o.bpm || 110, lead: o.lead || 'square', mel, mlen, bass, drum, len, drums: o.drums !== false };
  trackCache[id] = t;
  return t;
}
const Music = {
  cur: null, timer: null, step: 0, nextT: 0, pending: null,
  play(track) {
    if (!track) return this.stop();
    if (this.cur && this.cur.id === track.id) return;
    this.stop();
    if (!Snd.ac) { this.pending = track; return; }
    this.cur = track; this.step = 0; this.nextT = Snd.ac.currentTime + 0.08;
    this.timer = setInterval(() => this.tick(), 30);
  },
  stop() { clearInterval(this.timer); this.timer = null; this.cur = null; },
  tick() {
    const ac = Snd.ac, tr = this.cur;
    if (!ac || !tr) return;
    if (Snd.muted) { this.nextT = ac.currentTime + 0.05; return; }
    const spb = 60 / tr.bpm / 4;
    if (this.nextT < ac.currentTime - 0.3) this.nextT = ac.currentTime + 0.05;
    while (this.nextT < ac.currentTime + 0.12) {
      const i = this.step % tr.len, t = this.nextT;
      if (tr.mel[i] != null) Snd.tone(midi(tr.mel[i]), spb * tr.mlen[i] * 0.95, { type: tr.lead, vol: 0.09, out: Snd.mus, at: t });
      if (tr.bass[i] != null) Snd.tone(midi(tr.bass[i]), spb * 3.5, { type: 'triangle', vol: 0.22, out: Snd.mus, at: t });
      if (tr.drums) {
        const d = tr.drum[i];
        if (d === 1) Snd.tone(120, 0.1, { type: 'sine', vol: 0.3, slide: -70, out: Snd.mus, at: t });
        else if (d === 2) Snd.noise(0.09, { vol: 0.14, hp: 1500, out: Snd.mus, at: t });
        else if (d === 3) Snd.noise(0.02, { vol: 0.05, hp: 7000, out: Snd.mus, at: t });
      }
      this.nextT += spb; this.step++;
    }
  },
};

// kind: bowl | plate | cone | slice | dog | pie | cup | skewer | croissant | taco
function drawFood(g, f, cx, by, eaten = 0) {
  const left = 1 - eaten;
  const c = f.colors;
  switch (f.base) {
    case 'bowl': {
      // 국물/음식
      const fh = Math.round(6 * left);
      if (fh > 0) {
        rect(g, cx - 10, by - 9 - fh + 1, 21, fh, c[0]);
        for (let i = 0; i < 9 * left; i++) { const x = cx - 8 + ((i * 7) % 17), y = by - 9 - Math.floor(fh * 0.6) + (i % 3); rect(g, x, y, 3, 2, c[1 + (i % (c.length - 1))]); }
        if (f.egg && left > 0.5) { rect(g, cx + 2, by - 13, 5, 4, '#ffffff'); rect(g, cx + 3, by - 12, 3, 2, '#ffb52e'); }
      }
      rect(g, cx - 11, by - 9, 23, 2, '#ffffff');
      for (let i = 0; i < 7; i++) { const w = 23 - i * 2; rect(g, cx - Math.floor(w / 2), by - 8 + i, w, 1, i < 2 ? (f.bowl || '#e8e0d0') : shade(f.bowl || '#e8e0d0', -0.12)); }
      if (f.bowlStripe) hline(g, cx - 9, by - 6, 19, f.bowlStripe);
      break;
    }
    case 'plate': {
      rect(g, cx - 13, by - 3, 27, 2, '#f4f4f4'); rect(g, cx - 11, by - 1, 23, 1, '#c9c9d0');
      const n = Math.ceil(f.pieces * left);
      for (let i = 0; i < n; i++) {
        const x = cx - 10 + i * Math.floor(20 / f.pieces);
        if (f.piece === 'taco') { rect(g, x, by - 8, 7, 5, c[0]); rect(g, x + 1, by - 9, 5, 2, c[1]); px(g, x + 2, by - 10, c[2]); px(g, x + 4, by - 10, c[3] || c[2]); }
        else if (f.piece === 'meat') { rect(g, x, by - 8, 6, 5, c[0]); rect(g, x + 1, by - 7, 4, 1, c[1]); px(g, x + 2, by - 5, c[2]); }
        else if (f.piece === 'croissant') { rect(g, x, by - 7, 8, 4, c[0]); rect(g, x + 2, by - 8, 4, 1, c[0]); vline(g, x + 3, by - 7, 4, c[1]); vline(g, x + 5, by - 7, 4, c[1]); }
        else if (f.piece === 'dog') { rect(g, x, by - 7, 9, 4, c[0]); rect(g, x - 1, by - 8, 11, 2, c[1]); hline(g, x + 1, by - 9, 7, c[2]); }
        else if (f.piece === 'pie') { rect(g, x, by - 8, 9, 5, c[0]); hline(g, x, by - 8, 9, c[1]); px(g, x + 4, by - 9, c[2]); }
        else { rect(g, x, by - 7, 6, 4, c[i % c.length]); }
      }
      break;
    }
    case 'slice': {
      const n = Math.ceil(3 * left);
      rect(g, cx - 13, by - 3, 27, 2, '#f4f4f4');
      for (let i = 0; i < n; i++) {
        const x = cx - 11 + i * 8;
        for (let j = 0; j < 8; j++) rect(g, x + Math.floor(j / 2), by - 4 - j, 7 - j, 1, j === 0 ? c[2] : c[0]);
        px(g, x + 2, by - 6, c[1]); px(g, x + 4, by - 8, c[1]);
      }
      break;
    }
    case 'cone': {
      tri(g, cx - 4, by - 10, 9, 10, '#d9a05a');
      const h = Math.round(10 * left);
      for (let i = 0; i < h; i++) { const w = i < 2 ? 7 : 11; rect(g, cx - Math.floor(w / 2), by - 11 - i, w, 1, c[i < 5 ? 0 : 1]); }
      if (h > 6) circ(g, cx, by - 11 - h, 2, c[2] || c[0]);
      break;
    }
    case 'cup': {
      rect(g, cx - 7, by - 14, 15, 14, '#f4f4f4'); rect(g, cx - 7, by - 10, 15, 4, '#e8394a');
      text(g, '라면', cx, by - 10, '#ffffff', { align: 'center', font: FS });
      if (left > 0.1) { rect(g, cx - 6, by - 15, 13, 2, c[0]); for (let i = 0; i < 3; i++) { const y = by - 18 - i * 3 + Math.round(Math.sin(performance.now() / 200 + i) * 1); px(g, cx - 3 + i * 3, y, '#ffffff'); } }
      break;

    case 'skewer': {

      const n = Math.ceil(3 * left);
      for (let i = 0; i < n; i++) { const x = cx - 12 + i * 9; hline(g, x - 1, by - 7, 9, '#d9c9a0'); for (let j = 0; j < 3; j++) rect(g, x + j * 2 + (j > 0 ? 1 : 0), by - 9, 2, 4, c[j % c.length]); }
      break;
    }
  }
}

function drawVehicle(g, v, x, y, t) {
  const flip = v.dir < 0;
  const W2 = v.kind === 'bus' ? 40 : v.kind === 'scooter' ? 12 : v.kind === 'tuktuk' ? 20 : 26;
  g.save();
  if (flip) { g.translate(Math.round(x) * 2 + W2, 0); g.scale(-1, 1); }
  x = Math.round(x); y = Math.round(y);
  const wheel = (wx) => { rect(g, wx - 2, y - 3, 5, 4, '#1e1e26'); px(g, wx, y - 2, '#8a8a99'); };
  const col = v.color;
  if (v.kind === 'bus') {
    rect(g, x, y - 20, 40, 17, col); rect(g, x, y - 20, 40, 2, shade(col, 0.25)); rect(g, x, y - 6, 40, 3, shade(col, -0.25));
    for (let i = 0; i < 5; i++) rect(g, x + 3 + i * 7, y - 16, 5, 5, '#a8d8f0');
    rect(g, x + 36, y - 16, 4, 8, '#a8d8f0');
    wheel(x + 8); wheel(x + 32);
  } else if (v.kind === 'tuktuk') {
    rect(g, x + 2, y - 15, 15, 2, '#2b6cb0'); rect(g, x + 3, y - 13, 2, 8, '#2b2b35'); rect(g, x + 14, y - 13, 2, 8, '#2b2b35');
    rect(g, x + 2, y - 7, 17, 4, col); rect(g, x + 16, y - 12, 4, 6, col);
    wheel(x + 5); wheel(x + 16);
  } else if (v.kind === 'scooter') {
    rect(g, x + 2, y - 7, 9, 3, col); rect(g, x + 9, y - 12, 2, 6, '#555'); rect(g, x + 4, y - 15, 5, 8, '#3a5bd9'); rect(g, x + 4, y - 18, 4, 3, '#f6cfa6'); rect(g, x + 3, y - 19, 6, 2, '#ffffff');
    wheel(x + 2); wheel(x + 10);
  } else if (v.kind === 'jeep') {
    rect(g, x, y - 12, 26, 9, col); rect(g, x + 4, y - 18, 16, 6, '#3a3a2a'); rect(g, x + 6, y - 16, 5, 3, '#a8d8f0'); rect(g, x + 13, y - 16, 5, 3, '#a8d8f0');
    rect(g, x + 22, y - 10, 4, 2, '#ffe9a8'); wheel(x + 6); wheel(x + 20);
  } else {
    // car / taxi
    rect(g, x + 5, y - 14, 15, 5, shade(col, -0.1)); rect(g, x + 7, y - 13, 5, 3, '#a8d8f0'); rect(g, x + 13, y - 13, 5, 3, '#a8d8f0');
    rect(g, x, y - 9, 26, 6, col); rect(g, x, y - 9, 26, 1, shade(col, 0.3)); rect(g, x + 23, y - 8, 3, 2, '#ffe9a8'); rect(g, x, y - 8, 2, 2, '#ff5252');
    if (v.kind === 'taxi') { rect(g, x + 10, y - 16, 6, 2, '#1b1530'); }
    wheel(x + 6); wheel(x + 20);
  }
  g.restore();
}

// ---------- 공통 지형 ----------
function mountain(g, cx, by, w, h, col, snow, snowFrac = 0.25, flat = 0, seed = 'm') {
  const r = seeded(seed + cx + w);
  const snowLine = [];
  for (let y = 0; y < h; y++) {
    const t = y / h;
    const half = flat / 2 + (w / 2 - flat / 2) * t;
    const yy = by - h + y;
    rect(g, cx - half, yy, half * 2 + 1, 1, t < snowFrac ? snow : col);
    if (y > 2 && t >= snowFrac - 0.02 && t < snowFrac + 0.02) snowLine.push([half, yy]);
  }
  if (snow && snowLine.length) {
    const [half, yy] = snowLine[0];
    for (let x = -half; x <= half; x += 2) { const d = Math.floor(r() * 5); vline(g, cx + x, yy, d, snow); }
  }
  // 그늘 (오른쪽)
  g.save(); g.globalAlpha = 0.18;
  for (let y = 0; y < h; y++) { const t = y / h; const half = flat / 2 + (w / 2 - flat / 2) * t; rect(g, cx + half * 0.25, by - h + y, half * 0.75 + 1, 1, '#1b1530'); }
  g.restore();
}
function hills(g, x0, w, by, h, col, seed) {
  const r = seeded(seed);
  const ph = r() * 10, f1 = 0.02 + r() * 0.02, f2 = 0.05 + r() * 0.03;
  for (let x = 0; x < w; x++) {
    const hh = Math.round(h * (0.55 + 0.3 * Math.sin(x * f1 + ph) + 0.15 * Math.sin(x * f2 + ph * 2)));
    vline(g, x0 + x, by - hh, hh + 20, col);
  }
}
function water(g, x, y, w, h, c1, c2, seed = 'w') {
  rect(g, x, y, w, h, c1);
  const r = seeded(seed);
  for (let i = 0; i < w * h / 40; i++) hline(g, x + r() * w, y + 2 + r() * (h - 2), 2 + r() * 5, c2);
}
function treeRound(g, x, by, s, c1, c2) {

function treePalm(g, x, by, s) {
  const h = Math.round(22 * s);

  for (const [dx, dy] of [[-8, 3], [8, 3], [-6, -2], [6, -2], [-10, 6], [10, 6]]) line(g, tx, ty, tx + dx * s, ty + dy * s, dy > 2 ? leaf2 : leaf);

}
function treeAcacia(g, x, by, s, col = '#5b7a3a') {

// ---------- 격자탑 (에펠/도쿄타워) ----------
function lattice(g, cx, by, h, bw, colAt, opt = {}) {
  const curve = opt.curve || 2.3;
  const hw = t => 1 + (bw / 2) * Math.pow(1 - t, curve);
  const archH = opt.arch ? Math.round(h * opt.arch) : 0;
  for (let y = 0; y < h; y++) {
    const t = y / h, w = hw(t), yy = by - y;
    const Lx = Math.round(cx - w), Rx = Math.round(cx + w);
    const [col, dark] = colAt(t);
    const leg = Math.max(1, Math.round(w * 0.2));
    const archW = archH && y < archH ? (w - leg - 1) * Math.sqrt(1 - (y / archH) ** 2) : -1;
    for (let x = Lx; x <= Rx; x++) {
      const u = x - cx;
      const isLeg = x < Lx + leg || x > Rx - leg;
      if (!isLeg && Math.abs(u) < archW) continue;
      if (isLeg || (x + y) % 5 === 0 || (x - y + 1000) % 5 === 0 || y % 10 === 0) px(g, x, yy, u < 0 ? col : dark);
    }
  }
  for (const p of opt.decks || []) {
    const yy = Math.round(by - h * p.t), w = hw(p.t) + 2;
    rect(g, cx - w, yy - p.h, w * 2 + 1, p.h, p.c);
    if (p.win) hline(g, cx - w + 1, yy - p.h + 1, w * 2 - 1, p.win);
  }
  return hw;
}

function drawLights(g, L, ox, night, t) {
  if (night <= 0.05) return;
  g.save();

    if (x < -40 || x > W + 40) continue;
    if (l.blink && Math.floor(t * 1.5 + l.x) % 2 === 0) continue;

      for (let r = l.r; r > 2; r -= Math.max(2, Math.floor(l.r / 4))) circ(g, x, l.y, r, l.c);
      g.globalCompositeOperation = 'source-over';
    } else if (l.sparkle) {
      if (night > 0.6 && (Math.floor(t) % 3 === 0)) {
        const r = seeded(Math.floor(t * 8));
        g.globalAlpha = night;
        for (let i = 0; i < 14; i++) px(g, x + r() * l.w, l.y + r() * l.h, '#ffffff');

    } else if (l.w) {

      if (l.label) text(g, l.label, x + l.w / 2, l.y + 1 + (l.ly || 0), l.fg || '#ffffff', { align: 'center' });

    } else {
      g.globalAlpha = night;

      if (l.r > 1) { px(g, x - 1, l.y, l.c); px(g, x + 1, l.y, l.c); px(g, x, l.y - 1, l.c); px(g, x, l.y + 1, l.c); }
    }
  }
  g.restore();
}

function distKm(a, b) {
  const R = 6371, toR = Math.PI / 180;
  const dLat = (b.lat - a.lat) * toR, dLon = (b.lon - a.lon) * toR;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * toR) * Math.cos(b.lat * toR) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

'use strict';
// =====================================================================
//  balance.js — 조회수/구독자 공식 (DOM 없음, node 시뮬레이션 가능)
// =====================================================================
const BAL = {
  START_MONEY: 3000000,
  START_SUBS: 37,
  DAY_LIMIT: 80,
  RPM: 3.5,                 // 조회수 1회당 원
  MONETIZE_AT: 1000,
  HOTEL: 55000, FOOD: 14000, ACT: 45000, ALBA: 70000,
  FLIGHT_BASE: 80000, FLIGHT_PER_KM: 55,
};
function novFor(count) { return count <= 0 ? 1.25 : count === 1 ? 0.75 : count === 2 ? 0.5 : 0.35; }
function computeVideo(o) {
  const R = o.rnd || Math.random;
  const clips = o.clips, n = clips.length;
  const mean = a => a.reduce((s, v) => s + v, 0) / a.length;
  const q = Math.min(110, mean(clips.map(c => c.q)) + Math.min(12, (n - 1) * 3));
  const nov = mean(clips.map(c => c.nov));
  const qf = Math.pow(Math.max(5, q) / 60, 1.7);
  const mission = clips.some(c => c.mission) ? 1.5 : 1;
  const evt = clips.some(c => c.kind === 'event') ? 1 : 0;
  const base = 900 + Math.pow(Math.max(0, o.subs), 0.9) * 1.45;
  const rookie = 1 + 2.5 * Math.exp(-Math.max(0, o.subs) / 4000);   // 신인 알고리즘 버프
  let views = base * qf * nov * o.style.views * mission * (o.laptop ? 1.15 : 1) * (o.buff || 1) * rookie * (0.7 + R() * 0.65);
  const vc = 0.03 + Math.max(0, q - 60) * 0.0025 + evt * 0.04 + (o.style.viral || 0) + (o.viralBonus || 0);
  let viral = 0;
  if (R() < vc) { viral = 4 + R() * 10; views *= viral; }
  views = Math.floor(views);
  const conv = (0.016 + q * 0.0004) * o.style.conv;
  let subs = Math.floor(views * conv * (0.8 + R() * 0.4));
  let backlash = false;
  if (o.style.risk && R() < o.style.risk) { backlash = true; subs = -Math.floor(o.subs * (0.01 + R() * 0.03)) - 5; }
  const likes = Math.floor(views * (0.025 + q * 0.0005));
  const revenue = o.monetized ? Math.floor(views * BAL.RPM) : 0;
  return { q: Math.round(q), nov, views, subs, likes, revenue, viral, backlash };
}
if (typeof module !== 'undefined') module.exports = { BAL, computeVideo, novFor };

'use strict';
// =====================================================================
//  ui.js — DOM 대화창/패널/토스트 (키보드 + 터치)
// =====================================================================
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function h(tag, attrs = {}, html = '') {
  const el = document.createElement(tag);
  for (const k in attrs) {
    if (k === 'class') el.className = attrs[k];
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), attrs[k]);
    else el.setAttribute(k, attrs[k]);
  }
  if (html) el.innerHTML = html;
  return el;
}

const UI = {
  root: document.getElementById('ui'),
  stack: [],
  isOpen() { return this.stack.length > 0; },
  key(k) {
    const top = this.stack[this.stack.length - 1];
    if (top && top.onKey) top.onKey(k);
  },
  push(m) { this.stack.push(m); this.root.appendChild(m.el); m.el.classList.add('in'); },
  pop(m) {
    const i = this.stack.indexOf(m);
    if (i >= 0) this.stack.splice(i, 1);
    if (m.el.parentNode) m.el.remove();
  },
  // 포커스 가능한 버튼 목록 탐색
  navigable(m, k) {
    const btns = [...m.el.querySelectorAll('button.btn:not([disabled])')];
    if (!btns.length) return false;
    let i = btns.indexOf(document.activeElement);
    if (i < 0) i = btns.findIndex(b => b.classList.contains('focus'));
    const cols = m.cols || 1;
    if (k === 'up' || k === 'down' || k === 'left' || k === 'right') {
      let step = k === 'up' ? -cols : k === 'down' ? cols : k === 'left' ? -1 : 1;
      if (cols === 1 && (k === 'left' || k === 'right')) return false;
      i = i < 0 ? 0 : clamp(i + step, 0, btns.length - 1);
      this.focus(btns, i); Snd.play('move'); return true;
    }
    if (k === 'a') { const b = btns[i < 0 ? 0 : i]; if (b) b.click(); return true; }
    return false;
  },
  focus(btns, i) {
    btns.forEach(b => b.classList.remove('focus'));
    const b = btns[i]; if (!b) return;
    b.classList.add('focus');
    try { b.focus({ preventScroll: true }); } catch (e) { b.focus(); }
    b.scrollIntoView({ block: 'nearest' });
  },
  // 하단 대화창 + 선택지
  ask(o) {
    if (typeof o === 'string') o = { text: o };
    return new Promise(res => {
      const choices = (o.choices || ['확인']).map(c => (typeof c === 'string' ? { label: c } : c));
      const el = h('div', { class: 'dlg' + (o.wide ? ' wide' : '') + (o.top ? ' top' : '') });
      const head = o.title ? `<div class="dlg-title">${o.icon ? `<span class="ico">${o.icon}</span>` : ''}${esc(o.title)}</div>` : '';
      el.innerHTML = `${head}<div class="dlg-text"></div><div class="dlg-choices"></div>`;
      const tx = el.querySelector('.dlg-text'), ch = el.querySelector('.dlg-choices');
      const full = o.text || '';
      let shown = 0, typing = !REDUCED && full.length > 0 && o.instant !== true;
      const render = () => { tx.innerHTML = esc(full.slice(0, shown)).replace(/\n/g, '<br>') + (typing ? '<span class="caret">▌</span>' : ''); };
      if (!typing) { shown = full.length; }
      render();
      let timer = null;
      if (typing) {
        timer = setInterval(() => {
          shown = Math.min(full.length, shown + 2);
          if (shown % 4 === 0) Snd.play('type');
          if (shown >= full.length) { typing = false; clearInterval(timer); }
          render();
        }, 22);
      }
      const m = { el, cols: 1 };
      const done = i => {
        if (typing) { typing = false; clearInterval(timer); shown = full.length; render(); return; }
        clearInterval(timer);
        Snd.play(i === o.cancel ? 'cancel' : 'select');
        this.pop(m); res(i);
      };
      choices.forEach((c, i) => {
        const b = h('button', { class: 'btn' + (c.cls ? ' ' + c.cls : ''), type: 'button' }, `<span class="cur">▶</span><span class="lbl">${esc(c.label)}</span>${c.sub ? `<span class="sub">${esc(c.sub)}</span>` : ''}`);
        if (c.disabled) { b.disabled = true; b.classList.add('off'); }
        b.addEventListener('click', e => { e.stopPropagation(); Snd.init(); done(i); });
        ch.appendChild(b);
      });
      tx.addEventListener('click', () => { if (typing) done(-1); });
      m.onKey = k => {
        if (typing && (k === 'a' || k === 'b')) { done(-1); return; }
        if (k === 'b' && o.cancel != null && o.cancel >= 0) { done(o.cancel); return; }
        if (k === 'b' && choices.length === 1 && !choices[0].disabled) { done(0); return; }
        this.navigable(m, k);
      };
      this.push(m);
      const first = [...ch.querySelectorAll('button.btn:not([disabled])')];
      if (first.length) this.focus(first, 0);
    });
  },
  say(text, o = {}) { return this.ask({ ...o, text, choices: [o.ok || '확인'] }); },
  // 가운데 큰 패널. build(body, close) 로 내용 구성. 반환: close 될 때 값
  panel(o) {
    return new Promise(res => {
      const el = h('div', { class: 'panel' + (o.cls ? ' ' + o.cls : '') });
      el.innerHTML = `<div class="panel-in">${o.title ? `<div class="panel-title">${o.icon ? `<span class="ico">${o.icon}</span>` : ''}<span>${esc(o.title)}</span>${o.closable !== false ? '<button class="x" type="button" aria-label="닫기">✕</button>' : ''}</div>` : ''}<div class="panel-body"></div></div>`;
      const body = el.querySelector('.panel-body');
      const m = { el, cols: o.cols || 1 };
      const close = v => { this.pop(m); if (o.onClose) o.onClose(); res(v); };
      const xb = el.querySelector('.x');
      if (xb) xb.addEventListener('click', () => { Snd.play('cancel'); close(null); });
      m.onKey = k => {
        if (o.onKey && o.onKey(k) === true) return;
        if (k === 'b' && o.closable !== false) { Snd.play('cancel'); close(null); return; }
        this.navigable(m, k);
      };
      m.refresh = () => {
        const st = body.scrollTop;
        body.innerHTML = ''; o.build(body, close, m);
        const b = [...body.querySelectorAll('button.btn:not([disabled])')];
        if (b.length) this.focus(b, clamp(m.lastFocus || 0, 0, b.length - 1));
        body.scrollTop = m.lastFocus == null ? 0 : st;
      };
      this.push(m);
      m.refresh();
    });
  },
  btn(label, onClick, o = {}) {
    const b = h('button', { class: 'btn' + (o.cls ? ' ' + o.cls : ''), type: 'button' }, `<span class="cur">▶</span><span class="lbl">${label}</span>${o.sub ? `<span class="sub">${o.sub}</span>` : ''}`);
    if (o.disabled) { b.disabled = true; b.classList.add('off'); }
    b.addEventListener('click', e => { e.stopPropagation(); Snd.init(); onClick(b); });
    return b;
  },
  toast(msg, o = {}) {
    const el = h('div', { class: 'toast' + (o.cls ? ' ' + o.cls : '') }, esc(msg));
    document.getElementById('toasts').appendChild(el);
    setTimeout(() => el.classList.add('out'), o.ms || 1800);
    setTimeout(() => el.remove(), (o.ms || 1800) + 400);
  },
  // 이름 입력
  input(o) {
    return new Promise(res => {
      const el = h('div', { class: 'dlg' });
      el.innerHTML = `<div class="dlg-title">${esc(o.title || '')}</div><div class="dlg-text">${esc(o.text || '')}</div><input id="name-input" class="inp" maxlength="${o.max || 12}" value="${esc(o.value || '')}" autocomplete="off" spellcheck="false"><div class="dlg-choices"></div>`;
      const inp = el.querySelector('input');
      const m = { el, cols: 1 };
      const done = () => { const v = inp.value.trim() || o.value || ''; Snd.play('select'); this.pop(m); res(v); };
      el.querySelector('.dlg-choices').appendChild(this.btn('결정', done));
      m.onKey = k => { if (k === 'a') done(); };
      this.push(m);
      setTimeout(() => { inp.focus(); inp.select(); }, 30);
    });
  },
};

const FX = { floats: [], shake: 0, flash: 0 };
function floatTxt(str, col, x, y, delay = 0) { FX.floats.push({ str, col, x, y, t: -delay }); }

  for (const f of FX.floats) {

const Wipe = { p: 0, dir: 0, onMid: null, onEnd: null };
function wipe(fn) {
  return new Promise(res => {
    Wipe.dir = 1;
    Wipe.onMid = async () => { await fn(); Wipe.dir = -1; Wipe.onEnd = res; };
  });
}
function updateWipe(dt) {
  if (Wipe.dir === 1) { Wipe.p += dt * 2.8; if (Wipe.p >= 1) { Wipe.p = 1; Wipe.dir = 2; const m = Wipe.onMid; Wipe.onMid = null; m && m(); } }
  else if (Wipe.dir === -1) { Wipe.p -= dt * 2.8; if (Wipe.p <= 0) { Wipe.p = 0; Wipe.dir = 0; const e = Wipe.onEnd; Wipe.onEnd = null; e && e(); } }
}
function drawWipe(g) {
  if (Wipe.p <= 0) return;
  const cs = 16, nx = W / cs, ny = Math.ceil(H / cs);
  g.fillStyle = OUT;
  for (let by = 0; by < ny; by++) for (let bx = 0; bx < nx; bx++) {
    const local = clamp(Wipe.p * 2 - (bx + by) / (nx + ny), 0, 1);
    const s = Math.round(local * cs / 2) * 2;
    if (s > 0) g.fillRect(bx * cs + (cs - s) / 2, by * cs + (cs - s) / 2, s, s);
  }
}

const LayerCache = {};

  return LayerCache[id];
}
const wl = makeCanvas(W, H), el2 = makeCanvas(W, H);

const CityScene = {
  city: null, L: null, px: 40, dir: 1, walkT: 0, cam: 0, npcs: [], animals: [], vehicles: [], parts: [],
  busy: false, target: null, near: null, t: 0, hourVis: 9, banner: 0, stepT: 0,
  enter(id, o = {}) {
    const same = this.city && this.city.id === id && o.resume;
    S.city = id; this.city = CITY[id]; this.L = cityLayers(id);
    this.px = o.x != null ? o.x : 40; this.dir = 1; this.target = null;
    this.cam = clamp(this.px + 6 - 160, 0, WORLD_W - W);
    if (!same) { this.spawn(); this.parts = []; }
    if (o.banner) this.banner = 3;
    Music.play(genTrack(id, this.city.music));
    this.hourVis = S.hour;
  },
  anchor() { return { x: Math.round(this.px - this.cam + 6), y: WALK_Y - 6 }; },
  spawn() {
    const c = this.city;
    this.npcs = [];
    for (let i = 0; i < 8; i++) this.npcs.push({ x: rand(20, WORLD_W - 20), dir: chance(0.5) ? 1 : -1, speed: rand(8, 20), look: randomLook(c), walkT: rand(0, 1), pause: 0, ev: false, y: WALK_Y + randi(-2, 3) });
    this.spawnEventNpcs();
    this.animals = [];
    const ak = c.animal, nA = ak === 'pigeon' ? 5 : ak === 'penguin' ? 4 : 2;
    for (let i = 0; i < nA; i++) this.animals.push({ kind: ak, x: rand(30, WORLD_W - 30), dir: chance(0.5) ? 1 : -1, t: rand(0, 5), walk: false, fly: 0, vy: 0, y: 0, home: 0 });
    this.vehicles = [];
    for (let i = 0; i < (c.vehicles.length ? 3 : 0); i++) this.vehicles.push(this.newVehicle(rand(0, WORLD_W)));
  },
  newVehicle(x) {
    const c = this.city, kind = pick(c.vehicles), dir = chance(0.5) ? 1 : -1;
    const color = kind === 'taxi' ? (c.id === 'newyork' ? '#ffd23f' : '#f4f4f4') : kind === 'bus' ? pick(['#3a5bd9', '#2fa36b', '#e8394a']) : pick(['#e8394a', '#3a5bd9', '#f4f4f4', '#2b2b33', '#ffd23f', '#2fa36b', '#c9c9d0']);
    return { kind, dir, color, x, speed: rand(40, 70) * (kind === 'bus' ? 0.7 : 1), y: dir > 0 ? 177 : 168 };
  },
  spawnEventNpcs() {
    for (const n of this.npcs) n.ev = false;
    const k = randi(1, 2);
    const cand = shuffle(this.npcs.slice());
    let placed = 0;
    for (const n of cand) {
      if (placed >= k) break;
      let x = rand(60, WORLD_W - 40);
      for (let tries = 0; tries < 10 && SPOTS.some(s => Math.abs(s.x - x) < 26); tries++) x = rand(60, WORLD_W - 40);
      n.x = x; n.ev = true; placed++;
    }
  },
  update(dt) {
    this.t += dt;
    if (Math.abs(S.hour - this.hourVis) > 6) this.hourVis = S.hour; else this.hourVis += (S.hour - this.hourVis) * Math.min(1, dt * 1.5);
    if (this.banner > 0) this.banner -= dt;
    const canAct = !UI.isOpen() && !this.busy && Wipe.dir === 0;
    let vx = 0;
    if (canAct) {
      if (Input.down.left) { vx = -1; this.target = null; }
      else if (Input.down.right) { vx = 1; this.target = null; }
      else if (this.target) {
        const d = this.target.x - (this.px + 6);
        if (Math.abs(d) < 2) { const tg = this.target; this.target = null; if (tg.what) this.interact(tg.what); }
        else vx = Math.sign(d);
      }
    } else if (this.busy) this.target = null;
    if (vx) {
      this.px = clamp(this.px + vx * 64 * dt, 6, WORLD_W - 20); this.dir = vx; this.walkT += dt;
      this.stepT -= dt; if (this.stepT <= 0) { this.stepT = 0.28; Snd.play('step'); }
    } else this.walkT = 0;
    this.cam = lerp(this.cam, clamp(this.px + 6 - 160, 0, WORLD_W - W), Math.min(1, dt * 6));
    // 근처 상호작용 대상
    this.near = null;
    const pc = this.px + 6;
    let best = 16;
    for (const sp of SPOTS) { const d = Math.abs(sp.x - pc); if (d < best) { best = d; this.near = { spot: sp }; } }
    for (const n of this.npcs) if (n.ev) { const d = Math.abs(n.x + 5 - pc); if (d < 13 && d < best + 6) { best = d; this.near = { npc: n }; } }
    if (canAct) {
      if ((Input.pressed.a || Input.pressed.up) && this.near) this.interact(this.near);
      else if (Input.pressed.b || Input.pressed.menu) openMenu();
      else if (Input.click) {
        const c = Input.click;
        if (c.y < 14 && c.x > W - 20) openMenu();
        else if (c.y >= 14) {
          const wx = c.x + this.cam;
          let what = null;
          for (const n of this.npcs) if (n.ev && Math.abs(n.x + 5 - wx) < 10 && c.y > 100) what = { npc: n };
          if (!what) for (const sp of SPOTS) if (Math.abs(sp.x - wx) < 24 && c.y > 70) what = { spot: sp };
          const tx = what ? (what.spot ? what.spot.x : what.npc.x + 5) : wx;
          if (what && Math.abs(tx - pc) < 14) this.interact(what);
          else this.target = { x: clamp(tx, 12, WORLD_W - 14), what };
        }
      }
    }
    this.updateNpcs(dt); this.updateAnimals(dt); this.updateVehicles(dt); this.updateParts(dt);
  },
  updateNpcs(dt) {
    for (const n of this.npcs) {
      if (n.ev) { n.walkT = 0; n.dir = (this.px > n.x) ? 1 : -1; continue; }
      if (n.pause > 0) { n.pause -= dt; n.walkT = 0; continue; }
      n.x += n.dir * n.speed * dt; n.walkT += dt;
      if (n.x < 8) { n.x = 8; n.dir = 1; } else if (n.x > WORLD_W - 18) { n.x = WORLD_W - 18; n.dir = -1; }
      if (chance(dt * 0.15)) n.pause = rand(0.8, 3);
      if (chance(dt * 0.05)) n.dir *= -1;
    }
  },
  updateAnimals(dt) {
    for (const a of this.animals) {
      const def = ANIMALS[a.kind];
      a.t += dt;
      if (a.fly) {
        a.fly += dt; a.x += a.dir * 40 * dt; a.y -= 50 * dt;
        if (a.fly > 6) { a.fly = 0; a.y = 0; a.x = rand(30, WORLD_W - 30); }
        continue;
      }
      if (a.kind === 'pigeon' && Math.abs(a.x - (this.px + 6)) < 18 && (Input.down.left || Input.down.right)) { a.fly = 0.01; a.dir = this.px > a.x ? -1 : 1; if (chance(0.5)) Snd.play('whoosh'); continue; }
      if (!a.walk && chance(dt * 0.3)) { a.walk = true; a.dir = chance(0.5) ? 1 : -1; }
      else if (a.walk && chance(dt * 0.4)) a.walk = false;
      if (a.walk) { a.x = clamp(a.x + a.dir * def.speed * dt, 10, WORLD_W - 20); }
    }
  },
  updateVehicles(dt) {
    for (const v of this.vehicles) {
      v.x += v.dir * v.speed * dt;
      if (v.dir > 0 && v.x > WORLD_W + 60) Object.assign(v, this.newVehicle(-60), { dir: 1, y: 177 });
      if (v.dir < 0 && v.x < -80) Object.assign(v, this.newVehicle(WORLD_W + 40), { dir: -1, y: 168 });
    }
  },
  updateParts(dt) {

    const spawn = (n, f) => { let k = n * dt * 60; while (k > 0) { if (k >= 1 || chance(k)) this.parts.push(f()); k -= 1; } };
    if (wx === 'rain') spawn(2.2, () => ({ k: 'rain', x: rand(-20, W + 40), y: rand(-20, 0), vx: -40, vy: rand(200, 260), life: 2 }));
    if (wx === 'snow') spawn(0.8, () => ({ k: 'snow', x: rand(-10, W + 10), y: -4, vx: rand(-8, 4), vy: rand(14, 28), life: 9, ph: rand(0, 6) }));
    const p = c.particle;
    if (p === 'petal' && wx !== 'rain') spawn(0.06, () => ({ k: 'petal', x: rand(0, W + 40), y: -4, vx: rand(-20, -8), vy: rand(10, 18), life: 12, ph: rand(0, 6) }));
    if (p === 'leaf') spawn(0.04, () => ({ k: 'leaf', x: rand(0, W + 40), y: -4, vx: rand(-18, -6), vy: rand(12, 20), life: 12, ph: rand(0, 6), col: pick(['#e8a12e', '#c9643a', '#d9b36a']) }));
    if (p === 'dust') spawn(0.12, () => ({ k: 'dust', x: W + 4, y: rand(60, 160), vx: rand(-60, -30), vy: rand(-3, 3), life: 8 }));
    if (p === 'confetti') spawn(0.05, () => ({ k: 'conf', x: rand(0, W), y: -4, vx: rand(-10, 10), vy: rand(15, 30), life: 10, ph: rand(0, 6), col: pick(['#ff5ec4', '#ffd23f', '#3fb6ff', '#7cff6b', '#ff8a2e']) }));
    if (p === 'powder' && chance(dt * 0.15)) { const col = pick(['#ff5ec4', '#ffd23f', '#3fb6ff', '#7cff6b', '#c94ad9']), x = rand(20, W - 20); for (let i = 0; i < 14; i++) this.parts.push({ k: 'puff', x, y: rand(110, 140), vx: rand(-20, 20), vy: rand(-20, 5), life: rand(0.6, 1.4), col }); }
    for (const q of this.parts) { q.x += q.vx * dt + (q.ph != null ? Math.sin(this.t * 2 + q.ph) * 0.3 : 0); q.y += q.vy * dt; q.life -= dt; if (q.k === 'rain' && q.y > 158 + rand(0, 20)) { q.life = 0; this.parts.push({ k: 'splash', x: q.x, y: q.y, vx: 0, vy: 0, life: 0.15 }); } }
    this.parts = this.parts.filter(q => q.life > 0 && q.y < H + 5);
    if (this.parts.length > 500) this.parts.splice(0, this.parts.length - 500);
  },
  draw(g) {
    const c = this.city, sk = skyAt(this.hourVis, c, S.weather);
    drawSky(g, sk, this.hourVis, this.t, { aurora: c.aurora ? (S.weather === 'cloud' ? 0.3 : 1) : 0, weather: S.weather, camX: this.cam });

async function checkTime(h) {

    await UI.say('너무 늦었다... 오늘은 숙소로 돌아가서 쉬자.', { title: '새벽 ' + clockStr() });

}
async function checkHp(cost) {

// ---------- 클립 ----------
function makeClip(kind, label, score, key, extra = {}) {
  const q = clamp(Math.round(score * 0.82 + gearQ(kind) + moodAdj() + 4), 3, 100);
  const nov = key ? novelty(key) : 1.3;
  if (key) S.filmed[key] = (S.filmed[key] || 0) + 1;
  return { id: S.nextId++, city: S.city, kind, label, q, nov, ...extra };
}
async function addClip(clip, quiet = false) {
  // 미션 체크
  const m = S.missions.find(mm => mm.city === clip.city && mm.kind === (clip.kind === 'night' || clip.kind === 'drone' ? 'landmark' : clip.kind));
  if (m) { clip.mission = true; S.missions = S.missions.filter(x => x !== m); UI.toast(`★ 시청자 미션 달성! (${m.short})`, { cls: 'gold' }); Snd.play('fanfare'); gain({ mood: 8 }); }
  if (S.clips.length >= clipCap()) {
    const worst = S.clips.reduce((a, b) => (a.q * a.nov <= b.q * b.nov ? a : b));
    const i = await UI.ask({ title: 'SD카드 가득 참', text: `저장 공간이 부족하다! (${S.clips.length}/${clipCap()})\n가장 별로인 클립 "${worst.label}"(${worst.q}점)을 지우고 저장할까?`, choices: ['지우고 저장', '새 클립 버리기'], cancel: 1 });
    if (i !== 0) return false;
    S.clips = S.clips.filter(c => c !== worst);
  }
  S.clips.push(clip);
  if (!quiet) await UI.say(`"${clip.label}" 클립 저장!\n퀄리티 ${stars(clip.q)} (${clip.q}점) · ${clip.nov >= 1.2 ? '신선한 소재!' : clip.nov >= 0.7 ? '무난한 소재' : '재탕 소재...'}${clip.mission ? ' · ★미션' : ''}`, { title: '촬영 완료' });
  if (S.clips.length === 1 && !S.flags.tipUpload) { S.flags.tipUpload = 1; await UI.say('클립은 숙소에서 편집해서 업로드할 수 있다. 여러 클립을 모아서 올리면 영상이 길어져 퀄리티 보너스!', { title: 'TIP' }); }
  return true;
}
async function eventClip(label, base, tag) {
  const clip = makeClip('event', label, base + rand(-8, 8), null, { tag });
  clip.nov = 1.3;
  return addClip(clip);
}

async function sleep(cost) {
  await wipe(() => {
    if (cost) S.money -= cost;
    const before = S.day;
    if (S.hour >= 5) S.day++;
    S.hour = 8;
    if (S.day !== before) onNewDay();
    S.hp = cost ? (S.status.sick ? 70 : 100) : Math.max(S.hp, 55);
    S.mood = clamp(S.mood + (cost ? 6 : -10), 0, 100);
    CityScene.px = SPOTS[1].x; CityScene.cam = clamp(CityScene.px + 6 - 160, 0, WORLD_W - W); CityScene.hourVis = S.hour;
    CityScene.spawnEventNpcs();
  });
  Snd.play('ding');
  save();
  if (S.day > DAY_LIMIT) return;

function videoTitle(clips, style) {
  const c = CITY[clips[clips.length - 1].city];
  const kinds = clips.map(x => x.kind);
  const food = clips.find(x => x.kind === 'food'), act = clips.find(x => x.kind === 'act');
  const lm = clips.find(x => x.kind === 'landmark' || x.kind === 'night' || x.kind === 'drone');
  const ep = S.videos.length + 1;
  if (style === 'honest') {
    const parts = [];
    if (lm) parts.push(lm.kind === 'night' ? `${c.lmName} 야경` : c.lmName);
    if (food) parts.push(`${CITY[food.city].food.name} 먹방`);
    if (act) parts.push(CITY[act.city].act.short);
    const ev = clips.find(x => x.kind === 'event');
    if (ev && parts.length < 3) parts.push(ev.label);
    return `[세계일주 EP.${ep}] ${c.name} ${parts.slice(0, 3).join(' + ') || '브이로그'}`;
  }
  if (style === 'bait') {
    const t = [
      `충격!! ${c.name}에서 '이것' 하다가 쫓겨날 뻔 (실화)`,
      food ? `${CITY[food.city].food.name} 먹다가 응급실 갈 뻔한 썰ㄷㄷ` : `${c.name} 현지인도 모르는 숨겨진 비밀`,
      `여행 유튜버가 ${c.name}에서 오열한 이유...`,
      `${c.name} 가지 마세요. 진짜로요.`,
      act ? `${CITY[act.city].act.short} 하다가 인생 망할 뻔 했습니다` : `제 인생을 바꾼 ${c.name}의 하루`,
    ];
    return t[(ep + clips.length) % t.length];
  }
  const t = [
    `${c.name}의 오후, 바람이 불었다`,
    food ? `${CITY[food.city].food.name} 한 그릇에 담긴 위로 | ${c.name}` : `천천히 걸어도 괜찮아 | ${c.name} 브이로그`,
    `지금 이 순간, ${c.name}`,
    `오늘도 낯선 곳에서 잘 지내고 있어요 | ${c.name}`,
  ];
  return t[(ep + clips.length) % t.length];
}

function makeComments(clips, style, v) {
  const c = CITY[clips[0].city], out = [];
  const fill = s => s.replace('{city}', c.name).replace('{food}', c.food.name).replace('{lm}', c.lmName).replace('{act}', c.act.short);
  const add = list => { const opts = list.map(fill).filter(t => !out.some(o => o.t === t)); if (opts.length) out.push({ n: pick(NICKS), t: pick(opts) }); };
  if (S.subs < 300) out.push({ n: '엄마', t: pick(COMMENTS.small) });
  if (v.viral) add(COMMENTS.viral);
  if (style.id === 'bait') add(COMMENTS.bait);
  if (style.id === 'mood') add(COMMENTS.mood);
  if (v.q >= 80) add(COMMENTS.high); else if (v.q < 40) add(COMMENTS.low);
  for (const k of ['food', 'landmark', 'drone', 'act', 'event']) if (clips.some(x => x.kind === k || (k === 'landmark' && x.kind === 'night'))) add(COMMENTS[k]);
  for (let i = 0; i < 8 && out.length < 5; i++) add(COMMENTS.any);
  return shuffle(out).slice(0, 5);
}
function thumbCanvas(vid, clips) {

  rect(g, W - 40, H - 16, 36, 12, OUT); text(g, `${Math.max(1, Math.round(clips.length * 4.5))}:${String(randi(10, 59))}`, W - 22, H - 15, '#ffffff', { align: 'center' });

async function showResult(vid, v, clips, comments, subs0) {

        }
      }, 40);
    },
  });
}

const ask = (title, text, choices, cancel) => UI.ask({ title, text, choices, cancel });
function seenW(id, w) { const n = (S.flags.seen && S.flags.seen[id]) || 0; return w / (1 + n * 1.5); }
async function runFrom(pool, arg) {
  const list = pool.filter(e => !e.cond || e.cond(arg)).map(e => ({ ...e, w: seenW(e.id, e.w || 1) }));
  if (!list.length) return null;
  const e = weighted(list);
  S.flags.seen[e.id] = (S.flags.seen[e.id] || 0) + 1;
  return e.run(arg);
}

  { id: 'luggage', w: 1, cond: f => f.kind !== 'land', run: async () => { const owned = ITEMS.filter(it => S.items[it.id] > 0); if (owned.length) { const it = pick(owned); S.items[it.id] = 0; await say('수하물 분실', `짐 하나가 다른 나라로 갔다... ${it.name}을(를) 전부 잃어버렸다.`); } else { gain({ money: -Math.min(S.money, 50000) }); await say('수하물 분실', '캐리어가 안 나왔다... 당장 필요한 옷을 새로 샀다.'); } gain({ mood: -10 }); } },

      else if (i === 1) gain({ mood: -5 });
      else if (chance(0.5)) { gain({ subs: Math.floor(S.subs * 0.03) }); await say('사이다', '사이다 대응이라며 화제가 됐다!'); }
      else { gain({ subs: -Math.floor(S.subs * 0.02), mood: -10 }); await say('역풍', '"속 좁다"는 반응이 쏟아졌다...'); }

      if (i === 0) { S.flags.sponsorAd = 1; gain({ money: amt }); await say('계약 완료', '"유료 광고 포함" 표기도 잊지 말자.'); }
    },
  },
  {

      if (i === 0) { gain({ money: amt }); if (chance(0.6)) S.flags.coin = S.day + 2; }
      else { gain({ mood: 5 }); await say('', '나중에 뉴스를 보니 거절하길 잘했다...'); }
    },
  },
  { id: 'copyright', w: 1, cond: () => S.monetized, run: async () => { const last = S.videos[S.videos.length - 1]; const lose = Math.min(S.money, Math.floor(last.views * BAL.RPM)); gain({ money: -lose, mood: -10 }); await say('저작권 신고', `배경음악 저작권 신고를 받았다! 방금 영상의 광고 수익 ${won(lose)}이 몰수됐다.`); } },
  {
    id: 'tv', w: 1.5, cond: () => S.subs >= 50000, run: async () => {
      const fee = Math.round(rand(10, 30)) * 100000;

      if (i !== 0) return;
      await wipe(() => { S.day++; onNewDay(); });
      gain({ money: fee, subs: Math.floor(S.subs * rand(0.03, 0.06)), mood: 10 });
      await say('방송 출연', '방송 출연 후 채널 검색량이 폭발했다!');
    },
  },
  { id: 'fanart', w: 1.5, cond: () => S.subs >= 2000, run: async () => { gain({ mood: 15 }); await say('팬아트', `구독자가 『${S.channel}』 캐릭터 팬아트를 보내 줬다! 감동...`); } },
  { id: 'reverse', w: 1.2, cond: () => S.videos.length >= 3, run: async () => { const v = pick(S.videos.slice(0, -1)); const extra = Math.floor(v.views * rand(1, 3)); v.views += extra; S.totalViews += extra; const rev = S.monetized ? Math.floor(extra * BAL.RPM) : 0; S.revenue += rev; gain({ subs: Math.floor(extra * 0.02), money: rev }); await say('역주행', `예전 영상 "${v.title}"이(가) 갑자기 역주행 중! 조회수 +${fmt(extra)}`); } },
  {
    id: 'copycat', w: 1, cond: () => S.subs >= 10000, run: async () => {
      const i = await ask('표절 의혹', '내 영상 구성을 그대로 베낀 채널을 발견했다.', ['공개적으로 저격한다', '조용히 신고만 한다']);
      if (i === 0) { if (chance(0.6)) { gain({ subs: Math.floor(S.subs * 0.04), mood: 8 }); await say('승리', '구독자들이 내 편을 들어 줬다!'); } else { gain({ subs: -Math.floor(S.subs * 0.02), mood: -10 }); await say('진흙탕', '진흙탕 싸움이 됐다...'); } }

  { id: 'goodsleep', w: 1, run: async () => { gain({ hp: 10, mood: 10 }); await say('개운한 아침', '오랜만에 꿀잠을 잤다! 컨디션 최고!'); } },
];
async function coinScandal() {
  shake(5); Snd.play('bad');
  const loss = Math.floor(S.subs * 0.08);
  gain({ subs: -loss, mood: -25 });
  await say('코인 사기 논란', `'떡상코인'이 먹튀했다는 뉴스가 떴다!\n광고했던 유튜버로 이름이 오르내린다... 구독자 -${fmt(loss)}`);

}

// ---- main.js ----
'use strict';
// =====================================================================
//  main.js — 화면 크기, 터치 패드, 부팅
// =====================================================================
function fitScreen() {
  const scr = document.getElementById('screen');
  const r = scr.getBoundingClientRect();
  const s = r.width / W;
  const fs = s >= 3.4 ? 24 : s >= 2.3 ? 18 : 12;
  scr.style.setProperty('--fs', fs + 'px');
  const below = innerHeight - r.bottom;
  document.body.classList.toggle('portrait-ui', innerHeight > innerWidth * 1.15 && below > 200);
  document.body.style.setProperty('--sb', Math.round(r.bottom + 8) + 'px');
}
addEventListener('resize', fitScreen);
if (window.ResizeObserver) new ResizeObserver(fitScreen).observe(document.getElementById('screen'));

// 터치 패드
document.querySelectorAll('#pad [data-k]').forEach(b => {
  const k = b.dataset.k;
  const down = e => { e.preventDefault(); b.classList.add('on'); vkey(k, true); };
  const up = e => { e.preventDefault(); b.classList.remove('on'); vkey(k, false); };
  b.addEventListener('pointerdown', down);
  b.addEventListener('pointerup', up);
  b.addEventListener('pointercancel', up);
  b.addEventListener('pointerleave', up);
});
const soundBtn = document.getElementById('sound-btn');
function updateSoundBtn() { if (soundBtn) { soundBtn.textContent = Snd.muted ? '소리 꺼짐' : '소리 켜짐'; soundBtn.setAttribute('aria-pressed', String(!Snd.muted)); } }
if (soundBtn) soundBtn.addEventListener('click', () => { Snd.init(); Snd.toggle(); });
const padBtn = document.getElementById('pad-btn');
if (padBtn) padBtn.addEventListener('click', () => { document.body.classList.remove('hide-pad'); document.body.classList.toggle('show-pad'); fitScreen(); try { localStorage.setItem('tdtv_pad', document.body.classList.contains('show-pad') ? '1' : '0'); } catch (e) { } });
let padPref = null;
try { padPref = localStorage.getItem('tdtv_pad'); } catch (e) { }
if (padPref === '1' || (padPref == null && (matchMedia('(pointer: coarse)').matches || navigator.maxTouchPoints > 0))) document.body.classList.add('show-pad');
if (padPref === '0') document.body.classList.add('hide-pad');

async function boot(data) {
  fitScreen();
  updateSoundBtn();
  try { await Promise.race([Promise.all([document.fonts.load(FS), document.fonts.load(FM), document.fonts.load(FB)]), new Promise(r => setTimeout(r, 2500))]); } catch (e) { }
  txtCache.clear();
  WorldMap.build();
  ctx.fillStyle = OUT; ctx.fillRect(0, 0, W, H);
  if (data && data.S) {
    S = data.S;
    setScene(CityScene, S.city, { x: SPOTS[1].x });
  } else setScene(TitleScene);
  requestAnimationFrame(t => { lastT = t; frame(t); });
}
if (window.claude && window.claude.hot && window.claude.hot.snapshot) {
  try { window.claude.hot.snapshot(() => (S ? { S: JSON.parse(JSON.stringify(S)) } : {})); } catch (e) { }
}
const hot = window.claude && window.claude.hot;
if (hot && hot.ready) hot.ready(boot); else boot((hot && hot.data) || {});

</script>
