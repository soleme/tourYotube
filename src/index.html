<title>80일간의 떡상 여행</title>
<meta name="description" content="여행 유튜버가 되어 80일 동안 세계를 돌며 구독자 100만을 노리는 도트 어드벤처 게임">
<style>
/*__FONTS__*/
/*__CSS__*/
</style>
<div id="app">
  <div id="frame">
    <div id="screen">
      <canvas id="cv" width="320" height="180" aria-label="게임 화면"></canvas>
      <div id="ui"></div>
      <div id="toasts" aria-live="polite"></div>
    </div>
    <div id="pad" aria-label="터치 컨트롤">
      <div class="dpad">
        <button type="button" data-k="up" class="u" aria-label="위">▲</button>
        <button type="button" data-k="left" class="l" aria-label="왼쪽">◀</button>
        <button type="button" data-k="right" class="r" aria-label="오른쪽">▶</button>
        <button type="button" data-k="down" class="d" aria-label="아래">▼</button>
      </div>
      <div class="mid"><button type="button" data-k="menu" class="menu">메뉴</button></div>
      <div class="ab">
        <button type="button" data-k="b" class="b" aria-label="취소">B</button>
        <button type="button" data-k="a" class="a" aria-label="행동·결정">A</button>
      </div>
    </div>
    <div id="bar">
      <span class="keys">←→ 이동 · Space 행동 · Esc 메뉴 · M 소리</span>
      <span class="btns"><button id="sound-btn" type="button" aria-pressed="true">소리 켜짐</button><button id="pad-btn" type="button">터치 패드</button></span>
    </div>
  </div>
</div>

/*__JS__*/
